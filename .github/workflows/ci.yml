name: Windows CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Build, test and start on Windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File .\setup.ps1
      - run: node scripts/smoke.mjs

  release:
    name: Package and publish Windows release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test the release ZIP from a clean extraction
        run: .\scripts\package.ps1 -Tag $env:GITHUB_REF_NAME -OutputDirectory "$env:RUNNER_TEMP\camera-wall-release"
      - name: Publish ZIP and SHA-256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseFiles = Join-Path $env:RUNNER_TEMP 'camera-wall-release'
          $zip = Get-ChildItem -LiteralPath $releaseFiles -File -Filter '*.zip'
          $checksum = Get-ChildItem -LiteralPath $releaseFiles -File -Filter '*.sha256'
          gh release create $env:GITHUB_REF_NAME $zip.FullName $checksum.FullName --verify-tag --notes-from-tag --title "Local Camera Wall $env:GITHUB_REF_NAME"
